name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto:
    name: Protobuf (lint, generation drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Install buf and codegen plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: buf lint
        run: buf lint
      - name: buf generate (fail if committed output is stale)
        run: |
          buf generate
          if ! git diff --exit-code -- internal/api/gen docs/api; then
            echo "Generated code is out of date with proto/ — run 'buf generate' and commit the result."
            exit 1
          fi

  go:
    name: Go (format, vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: go test
        run: go test ./... -race -cover

  worker:
    name: Python worker (ruff, black, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install worker package
        working-directory: worker
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: worker
        run: ruff check .
      - name: black --check
        working-directory: worker
        run: black --check .
      - name: pytest
        working-directory: worker
        run: pytest

  frontend:
    name: Frontend (lint, format, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f Dockerfile -t orionqueue/api:ci .
      - name: Build scheduler image
        run: docker build -f deploy/docker/scheduler.Dockerfile -t orionqueue/scheduler:ci .
      - name: Build worker image
        run: docker build -f deploy/docker/worker.Dockerfile -t orionqueue/worker:ci .
      - name: Build frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t orionqueue/frontend:ci .
