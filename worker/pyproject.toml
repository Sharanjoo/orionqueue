[project]
name = "orionqueue-worker"
version = "0.1.0"
description = "OrionQueue worker agent: registers with the control plane, reports GPU resources, and executes jobs."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "grpcio>=1.68",
  "protobuf>=5.28",
  # Provides google.api.annotations_pb2/http_pb2: worker_service_pb2.py
  # imports them at runtime because worker_service.proto uses a
  # google.api.http REST binding on ListWorkers, even though this Python
  # client only calls it over gRPC. Standard fix for this exact situation.
  "googleapis-common-protos>=1.65",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "grpcio-tools>=1.68",
]

[project.scripts]
orionqueue-worker = "agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Two search roots: "." finds this project's own agent/gpu packages;
# "gen" finds "orionqueue" (and orionqueue.v1) as top-level packages
# rooted at worker/gen/orionqueue — which is what protoc actually
# generated, since it names cross-file imports after the .proto's own
# import path (orionqueue/v1/job.proto), not after wherever --python_out
# happens to write files. Installing "orionqueue" for real here (rather
# than a sys.path hack in application code) is what makes those imports
# resolve correctly under both an editable dev install and a normal
# `pip install .` — the latter is what deploy/docker/worker.Dockerfile
# does, where a source-tree-relative sys.path trick would silently break.
where = [".", "gen"]
include = ["agent*", "gpu*", "orionqueue*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# gen/ is machine-generated by scripts/proto-gen-python.sh (protoc), not
# hand-written — it isn't expected to follow this project's style rules,
# and it gets regenerated wholesale on every proto change anyway.
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "gen"

[tool.pytest.ini_options]
testpaths = ["tests"]
