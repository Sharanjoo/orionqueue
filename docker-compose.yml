# Phase 1 scope: build and run the four OrionQueue services standalone, to
# prove each one containerizes and starts correctly. PostgreSQL, etcd,
# Prometheus, Grafana, MinIO, and multiple fake workers are added in
# Phase 12 (see docs/adr/0006-kubernetes-deployment-strategy.md for the
# same fake-worker-first philosophy applied to Kubernetes).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orionqueue/api:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
    ports:
      - "7080:7080" # REST gateway + /healthz, /readyz
      - "9080:9080" # gRPC (server reflection on, so grpcurl works with no local .proto files)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/scheduler.Dockerfile
    image: orionqueue/scheduler:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
    ports:
      - "7081:7081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: orionqueue/worker:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
      ORIONQUEUE_WORKER_ID: worker-compose-1

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: orionqueue/frontend:local
    ports:
      - "8088:80"
