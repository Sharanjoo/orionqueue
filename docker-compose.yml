# Phase 3 added PostgreSQL (durable job state) and a one-shot migration
# step. Phase 4 adds etcd (worker liveness leases — see ADR-0001 and
# internal/leases). Prometheus, Grafana, MinIO, and multiple fake workers
# are added in Phase 12 (see docs/adr/0006-kubernetes-deployment-strategy.md
# for the same fake-worker-first philosophy applied to Kubernetes).
services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - etcd
      - --name=orionqueue-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=orionqueue-etcd=http://etcd:2380
    ports:
      - "2379:2379" # exposed for local debugging (etcdctl); not required by other services, which talk to "etcd:2379" over the compose network
    volumes:
      - orionqueue-etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orionqueue
      POSTGRES_PASSWORD: orionqueue
      POSTGRES_DB: orionqueue
    ports:
      - "5433:5432" # host 5433 (5432 was already taken by an unrelated local Postgres on this dev machine); exposed for local debugging (psql, a GUI client), not required by other services which talk to "postgres:5432" over the compose network
    volumes:
      - orionqueue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orionqueue -d orionqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://orionqueue:orionqueue@postgres:5432/orionqueue?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orionqueue/api:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
      ORIONQUEUE_DATABASE_URL: postgres://orionqueue:orionqueue@postgres:5432/orionqueue?sslmode=disable
      ORIONQUEUE_ETCD_ENDPOINTS: etcd:2379
    ports:
      - "7080:7080" # REST gateway + /healthz, /readyz
      - "9080:9080" # gRPC (server reflection on, so grpcurl works with no local .proto files)
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/scheduler.Dockerfile
    image: orionqueue/scheduler:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
      ORIONQUEUE_DATABASE_URL: postgres://orionqueue:orionqueue@postgres:5432/orionqueue?sslmode=disable
      ORIONQUEUE_ETCD_ENDPOINTS: etcd:2379
      # Off by default per ADR-0005; set ORIONQUEUE_PREEMPTION_ENABLED=true
      # in your shell before `docker compose up` to turn it on locally.
      ORIONQUEUE_PREEMPTION_ENABLED: ${ORIONQUEUE_PREEMPTION_ENABLED:-false}
    ports:
      - "7081:7081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: orionqueue/worker:local
    environment:
      ORIONQUEUE_ENVIRONMENT: compose
      ORIONQUEUE_WORKER_ID: worker-compose-1
      ORIONQUEUE_API_GRPC_ADDR: api:9080
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: orionqueue/frontend:local
    ports:
      - "8088:80"

volumes:
  orionqueue-postgres-data:
  orionqueue-etcd-data:
